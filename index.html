<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julio Ideias | Portfólio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { scroll-behavior: smooth; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 0.5rem; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        yellow: {
                            400: '#FACC15',
                            500: '#EAB308',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white font-sans leading-relaxed">

    <header class="fixed w-full bg-black/90 backdrop-blur-sm border-b border-gray-800 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-yellow-400 tracking-wider">Studio Mais Ideias</a>
            <div class="hidden md:flex space-x-8 font-medium">
                <a href="#home" class="hover:text-yellow-400 transition-colors duration-300">Início</a>
                <a href="#portfolio" class="hover:text-yellow-400 transition-colors duration-300">Portfólio</a>
                <a href="#contato" class="hover:text-yellow-400 transition-colors duration-300">Contato</a>
            </div>
            <a href="#contato" class="bg-yellow-400 text-black px-6 py-2 rounded-full font-bold hover:bg-yellow-500 transition-colors duration-300 shadow-lg shadow-yellow-400/20">
                Contrate Agora
            </a>
        </nav>
    </header>

    <section id="home" class="pt-36 pb-20 px-6 text-center bg-gradient-to-b from-black to-gray-900">
        <div class="container mx-auto max-w-4xl">
            <h1 class="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight">
                Transformando Ideias em <span class="text-yellow-400 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600">Experiências Digitais</span>
            </h1>
            <p class="text-xl text-gray-300 mb-10 max-w-2xl mx-auto">
                Especialista em criação de conteúdo audiovisual, estratégia digital e branding. Conheça meu trabalho e eleve o nível da sua presença online.
            </p>
            <div class="flex justify-center space-x-6">
                <a href="https://instagram.com/julioideiasdigital" target="_blank" class="text-3xl text-gray-400 hover:text-pink-500 transition-colors duration-300 hover:scale-110 transform">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.linkedin.com/in/julioideias/" target="_blank" class="text-3xl text-gray-400 hover:text-blue-500 transition-colors duration-300 hover:scale-110 transform">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://www.youtube.com/@studiomaisideiasdigital" target="_blank" class="text-3xl text-gray-400 hover:text-red-500 transition-colors duration-300 hover:scale-110 transform">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
        </div>
    </section>

    <section id="portfolio" class="py-24 bg-gray-900">
        <div class="container mx-auto px-6 max-w-6xl">
            <div class="text-center mb-16">
                <h2 class="text-4xl font-bold mb-4"><span class="text-yellow-400">Meu Portfólio</span> no YouTube</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="bg-black p-2 rounded-2xl shadow-xl border border-gray-800 hover:border-yellow-400 transition-colors duration-300">
                    <div class="video-container rounded-xl overflow-hidden">
                        <iframe src="https://www.youtube.com/embed/w7sJmSDW3xg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>

                <div class="bg-black p-2 rounded-2xl shadow-xl border border-gray-800 hover:border-yellow-400 transition-colors duration-300">
                    <div class="video-container rounded-xl overflow-hidden">
                        <iframe src="https://www.youtube.com/embed/yui6B0LQvZE" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>
            </div>

            <div class="text-center mt-16">
                <a href="https://www.youtube.com/@studiomaisideiasdigital/videos" target="_blank" class="inline-flex items-center px-8 py-4 bg-transparent border-2 border-yellow-400 text-yellow-400 font-bold rounded-full hover:bg-yellow-400 hover:text-black transition-all duration-300 group">
                    <span>Acompanhe o Canal</span>
                    <i class="fas fa-arrow-right ml-3 group-hover:translate-x-1 transition-transform"></i>
                </a>
            </div>
        </div>
    </section>

    <section id="contato" class="py-24 bg-black">
        <div class="container mx-auto px-6 max-w-5xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
